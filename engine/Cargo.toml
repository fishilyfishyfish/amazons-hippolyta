[package]
name = "amazons-engine"
version = "0.1.0"
edition = "2021"
description = "Game of the Amazons engine (bitboard move generation)"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Pinned exactly: the wasm-bindgen CLI used in CI must match this version.
wasm-bindgen = "=0.2.129"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Perft cross-checks are heavy; keep tests reasonably fast.
[profile.test]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
