<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1f2a24">
<title>Amazons — Hippolyta</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="layout">
  <section class="board-wrap">
    <div class="board-row">
      <div class="vbar" id="vbar" role="img" aria-label="평가 막대 (백 기준)">
        <div class="vfill" id="vfill"></div>
        <span class="vlabel" id="vlabel"></span>
      </div>
      <div class="board-area" id="boardArea">
        <div id="board" class="board" aria-label="아마존 게임판" role="grid"></div>
        <svg id="annot" class="annot" viewBox="0 0 100 100" aria-hidden="true"></svg>
      </div>
    </div>
    <div class="board-tools">
      <button id="viewPrev" type="button" aria-label="이전 국면 (←)">◀</button>
      <button id="viewNext" type="button" aria-label="다음 국면 (→)">▶</button>
      <button id="drawBtn" type="button" aria-pressed="false">✏️ 그리기</button>
      <button id="clearDraw" type="button">지우기</button>
    </div>
    <p id="viewInfo" class="viewinfo"></p>
  </section>
  <aside class="panel">
    <h1>Amazons <span class="sub">Hippolyta</span></h1>
    <div class="modes" role="tablist" aria-label="모드">
      <button type="button" role="tab" data-mode="play">대국</button>
      <button type="button" role="tab" data-mode="coach">친절한 대국</button>
      <button type="button" role="tab" data-mode="analysis">분석</button>
      <button type="button" role="tab" data-mode="book">오프닝</button>
    </div>
    <p id="status" class="status" aria-live="polite">엔진 로딩 중…</p>
    <p id="hint" class="hint"></p>
    <p id="aiInfo" class="aiinfo"></p>
    <div class="controls">
      <label id="opponentLabel">상대
        <select id="opponent">
          <option value="mcts:2000">엔진</option>
          <option value="human">사람 (같은 기기)</option>
        </select>
      </label>
      <label id="levelLabel">난이도
        <select id="level">
          <option value="1">1 · 입문</option>
          <option value="2">2 · 초급</option>
          <option value="3">3 · 중급</option>
          <option value="4">4 · 상급</option>
          <option value="5" selected>5 · 최강</option>
        </select>
      </label>
      <label id="colorLabel">내 색
        <select id="color">
          <option value="0">백 (선)</option>
          <option value="1">흑 (후)</option>
        </select>
      </label>
    </div>
    <div class="toggles">
      <label><input type="checkbox" id="heat"> 영역 히트맵 <span class="legend"><i class="lw"></i>백 <i class="lb"></i>흑 <i class="lt"></i>동거리</span></label>
    </div>
    <div class="buttons">
      <button id="newGame" type="button">새 게임</button>
      <button id="undo" type="button">무르기</button>
      <button id="cancel" type="button">선택 취소</button>
    </div>
    <section id="coachPanel" class="analysis coach" hidden>
      <div class="coach-top">
        <div class="label">수 평가</div>
        <div class="coach-nav">
          <button id="evPrev" type="button" class="sm" aria-label="이전 수 평가">◀ 이전</button>
          <button id="evNext" type="button" class="sm" aria-label="다음 수 평가">다음 ▶</button>
        </div>
      </div>
      <div class="nav"><button id="hintBtn" type="button">힌트</button></div>
      <p id="coachLegend" class="hintlegend" hidden><span class="hm">1</span> 움직일 아마존 → <span class="hm">2</span> 도착 칸 → <span class="hm">3</span> 화살</p>
      <div id="coachBody" class="explain" aria-live="polite"></div>
    </section>
    <section id="bookPanel" class="analysis book" hidden>
      <div class="nav">
        <button id="bookBack" type="button" aria-label="한 수 뒤로">◀</button>
        <button id="bookStart" type="button">처음으로</button>
      </div>
      <p id="bookInfo" class="posinfo"></p>
      <p class="hintlegend">고른 수: <span class="hm">1</span> 움직일 아마존 → <span class="hm">2</span> 도착 칸 → <span class="hm">3</span> 화살</p>
      <div id="bookList" class="booklist"></div>
    </section>
    <section id="analysisPanel" class="analysis" hidden>
      <div class="nav">
        <button id="prev" type="button" aria-label="이전 수">◀</button>
        <button id="next" type="button" aria-label="다음 수">▶</button>
        <button id="showBest" type="button" aria-pressed="false">추천 수 보기</button>
      </div>
      <p id="analysisLegend" class="hintlegend" hidden><span class="hm">1</span> 움직일 아마존 → <span class="hm">2</span> 도착 칸 → <span class="hm">3</span> 화살</p>
      <p id="posInfo" class="posinfo"></p>
      <div id="graph" class="graph" aria-label="백 승률 그래프"></div>
      <div id="explain" class="explain" aria-live="polite"></div>
      <div class="kibo">
        <button id="analyzeAll" type="button">전체 분석</button>
        <button id="exportKibo" type="button">기보 복사</button>
        <button id="importKibo" type="button">기보 불러오기</button>
      </div>
      <p id="kiboMsg" class="kibomsg" aria-live="polite"></p>
      <textarea id="kiboText" class="kibotext" rows="3" hidden placeholder="예: d1-d7(g7) a7-e3(e6) ..."></textarea>
    </section>
    <div class="moves-wrap">
      <table class="moves">
        <caption class="moves-cap">기보 · 수를 누르면 그 국면과 평가를 봐요 (← → 키)</caption>
        <thead><tr><th>#</th><th>백</th><th>흑</th></tr></thead>
        <tbody id="moves"></tbody>
      </table>
    </div>
  </aside>
</main>
<script type="module" src="main.js"></script>
</body>
</html>
